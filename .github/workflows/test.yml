name: Tests

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Setup headless display
        uses: pyvista/setup-headless-display-action@5bc8de3bc71fcda7a96439571287a554901541a0 # v4.3
        with:
          qt: true
          wm: herbstluftwm

      - run: python -m pip install -U pip
      - run: python -m pip install -e .[testing]

      - name: Run tests
        env:
          MPLBACKEND: Agg
        run: pytest tests/ -v --cov=napari_flowreg

      - name: Sanity import (Linux only)
        if: runner.os == 'Linux'
        run: python -c "import napari_flowreg; print('napari-flowreg plugin loaded successfully')"
